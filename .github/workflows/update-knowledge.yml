name: Update knowledge base

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-knowledge-base
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild knowledge base
        env:
          MAX_PAGES_TO_CRAWL: "300"
          CRAWL_DELAY_SECONDS: "0.25"
        run: python scraper.py

      - name: Commit updated content
        run: |
          if git diff --quiet -- data/knowledge_base.json; then
            echo "Knowledge base is already current."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/knowledge_base.json
          git commit -m "chore: refresh AI knowledge base"
          git push
